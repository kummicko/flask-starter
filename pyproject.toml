[project]
name = "flask-starter"
version = "0.1.0"
description = "Flask + uv + Tailwind CSS + daisyUI starter with optional pywebview desktop mode"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# Desktop window via pywebview. GTK backend on Linux, native webview elsewhere.
desktop = [
    "pywebview[gtk]; sys_platform == 'linux'",
    "pywebview; sys_platform != 'linux'",
]

[project.scripts]
desktop = "app.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pyright]
venvPath = "."
venv = ".venv"
